<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Eco-sounds - js30</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.ico">
</head>
<body>

<!-- Header start -->
    <header class="header">
        <div class="container header-container">
            <img src="assets/svg/logo.svg" alt="logo" class="logo logo_active">
            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#" class="nav-link solovey">Соловей</a></li>
                    <li class="nav-item"><a href="#" class="nav-link drozd">Дрозд</a></li>

            </nav>
        </div>
    </header>
<!-- Header end -->

<!-- Main start -->
    <main class="main">
        <div class="container main-container">
            <audio src="assets/audio/solovey.mp3" class="audio"></audio>
            <audio src="assets/audio/drozd.mp3" class="audio"></audio>
            <audio src="assets/audio/zarynka.mp3" class="audio"></audio>
            <audio src="assets/audio/javoronok.mp3" class="audio"></audio>

        </div>

<!-- Main end -->

<!-- Footer start -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-copyright">
                <p class="footer-c-item">&#169;</p>
                <p class="footer-c-item">2022</p>
                <a class="footer-gh-link" href="https://github.com/Zorro-amarillo" title="RS School GitHub">github</a>

            <a href="https://rs.school/js-stage0/" class="rss-link"><img src="assets/svg/rss.svg" alt="rss" class="footer-rss"></a>

</html>
